<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore India - AI Enhanced Travel Booking</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- Geometric Animated SVG in Header -->
  <div class="header-geometry" aria-hidden="true">
    <svg width="160" height="160">
      <polygon class="geo-poly" points="60,10 120,30 140,90 80,140 20,90 35,30"/>
      <circle class="geo-dot" cx="80" cy="60" r="12"/>
    </svg>
  </div>
  <!-- Background Airplane and Road -->
  <div class="plane-animation" aria-hidden="true"></div>
  <div class="road-animation" aria-hidden="true"></div>
  <header class="header-bg">
    <h1>Explore India - Travel Booking App</h1>
    <p class="subtitle">
      Discover your perfect Indian adventure. AI-powered travel picks curated just for you!
    </p>
  </header>
  <section class="search-section section-bg">
    <input type="text" id="destination" placeholder="Destination"/>
    <input type="number" id="budget" placeholder="Max Budget"/>
    <input type="date" id="travel-date"/>
    <button id="search-btn">Search</button>
  </section>
  <section id="package-list" class="package-list"></section>

  <!-- Package Details Modal -->
  <div id="package-details" class="modal" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-content">
      <span id="close-modal" class="close" tabindex="0" role="button" aria-label="Close">&times;</span>
      <div id="package-info"></div>
      <div id="testimonials-section" style="margin-top: 1.5em;"></div>
    </div>
  </div>

  <!-- Booking Form Modal -->
  <div id="booking-form" class="modal" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-content">
      <span id="close-booking" class="close" tabindex="0" role="button" aria-label="Close">&times;</span>
      <form id="book-form">
        <h3>Book Your Trip</h3>
        <input type="text" id="traveler-name" placeholder="Your Name" required/>
        <input type="date" id="trip-date" required/>
        <input type="number" id="num-travelers" placeholder="Number of Travelers" required/>
        <button type="submit">Book Now</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
